<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TemplateMaker — 家具テンプレート</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>TemplateMaker</h1>
  <input id="name" placeholder="オフィスセットA" autocomplete="off">
  <button id="save">保存</button>
  <button id="new">新規</button>
  <select id="open"><option value="">テンプレートを開く…</option></select>
  <span id="msg"></span>
</header>

<main>
  <aside id="left">
    <div class="pane-head">
      <select id="cat"></select>
      <input id="find" placeholder="絞り込み" autocomplete="off">
    </div>
    <ul id="assets"></ul>
    <p class="note" id="libnote"></p>
  </aside>

  <div id="view"><canvas id="c"></canvas>
    <div id="hint">左の一覧から家具をここへドラッグしてください</div>
    <div id="angle" hidden></div>
  </div>

  <aside id="right">
    <h2>まとまり</h2>
    <table id="group"></table>
    <h2>置いたもの <span id="count"></span></h2>
    <ul id="placed"></ul>
    <h2>選択中</h2>
    <div id="sel" class="note">なし</div>
    <div id="rot" hidden>
      <div class="row">
        <label for="deg">向き</label>
        <input id="deg" type="number" step="1" min="0" max="359">
        <span class="unit">°</span>
      </div>
      <div class="row btns">
        <button data-turn="-15" title="左に15°">⟲</button>
        <button data-turn="15" title="右に15°">⟳</button>
        <button data-face="0">0</button>
        <button data-face="90">90</button>
        <button data-face="180">180</button>
        <button data-face="270">270</button>
      </div>
    </div>
    <div id="keys" class="note">
一覧からドラッグ=追加 / 家具をドラッグ=移動<br>
輪をドラッグ=回転（<kbd>Shift</kbd>で1°）<br>
      <kbd>Q</kbd><kbd>E</kbd>=15°回転 /
      <kbd>F</kbd>=寄る /
      <kbd>Backspace</kbd>=削除 / <kbd>Esc</kbd>=選択解除
    </div>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
