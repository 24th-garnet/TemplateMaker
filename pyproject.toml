[project]
name = "templatemaker"
version = "0.1.0"
description = "内装テンプレート用のサンプル家具セットを、公開 3D アセットから組み立てる"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
templatemaker = "templatemaker.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["templatemaker"]
